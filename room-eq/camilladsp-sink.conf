# Virtual output that CamillaDSP listens to. install.sh copies this to
# ~/.config/pipewire/pipewire.conf.d/ and makes the sink the default output,
# so everything played on the desktop (and AirPlay) goes through the EQ.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "camilladsp-sink"
      node.description = "KH 120A (room EQ)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      # Let the desktop volume control act on what CamillaDSP captures.
      monitor.channel-volumes = true
      monitor.passthrough     = true
    }
  }
]
